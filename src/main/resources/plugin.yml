name: Falloutak
version: '${version}'
main: cz.lollywood.falloutak.FalloutakPlugin
api-version: '1.21'
softdepend: [BetterModel]
description: Fallouťák in Minecraft. 0.1 = the EXAMPLE of the character sheet, the creation form, the survival sidebar and the battle controls.
permissions:
  falloutak.gm:
    description: Change NPC statblocks, the population and the groups
    default: op
commands:
  npc:
    description: NPC statblocks (character sheets). /npc [list|edit <name>|save|done|show <name>|delete <name>]
    usage: /npc [list|edit <name>|save|done|show <name>|delete <name>]
  pop:
    description: The base's population. /pop [list|add <name> <group> [species]|set <name> <field> <value>|remove <name>]
    usage: /pop [list|add|set|remove]
  group:
    description: The players' groups (part 6). /group [list|add <name>|xp <name> <amount>|spend <group>|unlock|grant|join]
    usage: /group [list|add|xp|spend|unlock|grant|join]
    aliases: [faction]
  xp:
    description: XP awards (part 6, the GM). /xp give|quest <team> <n> · kill <team> <HP...> · check <player> <difficulty> [doctor] · discover <team> · research <team> <tier> <rarity>
    usage: /xp give|quest|kill|check|discover|research
  sheet:
    description: The character sheet. /sheet [actions|create|hud|demo|battle]
    usage: /sheet [actions|create|hud|demo|battle]
  gm:
    description: The game master's menu (falloutak.gm)
    usage: /gm
  sounds:
    description: Your sounds. /sounds [fallout2|minecraft|female|male|test <key>|list]
    usage: /sounds [fallout2|minecraft|female|male|test <key>|list]
  creature:
    description: The game's creatures (GMs). /creature spawn radmie|trhac | play <animation> | remove
    usage: /creature spawn radmie|trhac | play <animation> | remove
  maps:
    description: The maps (part 9, GMs). /maps · go <world> [all] · back
    usage: /maps [go <world> [all]|back]
  anomaly:
    description: The anomalies (GMs, 09c). /anomaly kinds | place <kind> [radius] | field [radius] [count] | list | remove [id] | artifact <id> [name] | give <item> [count]
    usage: /anomaly kinds|place|field|list|remove|artifact|give
  blackrain:
    description: The Black Rain, the surge (GMs). /blackrain warn | start [rounds] [warning seconds, 60 by default, 0 = at once] | stop
    usage: /blackrain warn|start [rounds] [warning s]|stop
  pack:
    description: The Pip-Boy pictures in the sheet (the Falloutak pack). /pack [on|off|auto]
    usage: /pack [on|off|auto]
